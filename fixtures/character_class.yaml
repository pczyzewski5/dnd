App\Entity\CharacterClass:
  character_class_barbarian:
    __construct:
      - 12
      - barbarian
      - ~
      - ['@requirement_barbarian_class_proficiency']
  character_class_berserker:
    __construct:
      - 12
      - berserker
      - '@character_class_barbarian'
  character_class_rouge:
    __construct:
      - 8
      - rouge
      - ~
      - ['@requirement_rouge_class_proficiency']
  character_class_assassin:
    __construct:
      - 8
      - assassin
      - '@character_class_rouge'

  character_class_ranger:
    __construct:
      - 10
      - ranger

  character_class_wild_magic_sorcerer:
    __construct:
      - 6
      - wild magic sorcerer
      - ~
      - ['@requirement_sorcerer_class_proficiency']