parameters:
  requirement_human_variant_proficiency_config:
    '{
         "source": "race",
         "required_count": 1,
         "pool": [],
         "level": 1
     }'
  requirement_barbarian_class_proficiency_config:
    '{
         "source": "character class",
         "required_count": 2,
         "pool": [
             "animal handling",
             "athletics",
             "intimidation",
             "nature",
             "perception",
             "survival"
         ],
         "level": 1
     }'

App\Entity\Requirement:
  requirement_human_variant_proficiency:
    __construct:
      - proficiency
      - <{requirement_human_variant_proficiency_config}>
  requirement_barbarian_class_proficiency:
    __construct:
      - proficiency
      - <{requirement_barbarian_class_proficiency_config}>
