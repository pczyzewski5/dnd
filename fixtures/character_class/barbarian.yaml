App\Entity\CharacterClass:
  character_class_barbarian:
    __construct:
      - 12
      - barbarian
      - ~
      - [ '@requirement_barbarian_class_proficiency' ]
      - [
        '@proficiency_light_armors',
        '@proficiency_medium_armors',
        '@proficiency_shields',
        '@proficiency_simple_weapons',
        '@proficiency_martial_weapons',
        '@proficiency_strength',
        '@proficiency_constitution'
      ]

  character_class_berserker:
    __construct:
      - 12
      - berserker
      - '@character_class_barbarian'