App\Entity\Origin:
  origin_outlander:
    __construct:
      - outlander
      - [ '@proficiency_athletics', '@proficiency_survival' ]
  origin_marine:
    __construct:
      - marine
      - [ '@proficiency_athletics', '@proficiency_survival', '@proficiency_water_vehicles', '@proficiency_land_vehicles' ]
  origin_guild_artisan:
    __construct:
      - guild artisan
      - [ '@proficiency_insight', '@proficiency_persuasion' ]
  origin_hero_folk:
    __construct:
      - folk hero
      - [ '@proficiency_animal_handling', '@proficiency_survival' ]
  origin_acolyte_mod:
    __construct:
      - acolyte mod
      - [ '@proficiency_persuasion', '@proficiency_performance' ]
  origin_noble:
    __construct:
      - noble
      - [ '@proficiency_history', '@proficiency_persuasion' ]
      - [ '@requirement_origin_single_language' ]
  origin_sage:
    __construct:
      - sage
      - [ '@proficiency_arcana', '@proficiency_history' ]
      - [ '@requirement_origin_two_languages' ]
  origin_acolyte:
    __construct:
      - acolyte
      - [ '@proficiency_insight', '@proficiency_religion' ]
      - [ '@requirement_origin_two_languages' ]
