App\Entity\Race:
  race_human:
    __construct:
      - human
      - <{human_config}>

  race_human_variant:
    __construct:
      - human variant
      - <{human_variant_config}>
      - []
      - ['@requirement_human_variant_race_proficiency',
         '@requirement_race_single_language',
         '@requirement_human_variant_asi',
         '@requirement_human_variant_feat']

  race_lightfoot_halfling:
    __construct:
      - lightfoot halfling
      - <{lightfoot_halfling_config}>
      - ['@skill_lucky',
         '@skill_brave',
         '@skill_nimble',
         '@skill_naturally_stealthy']

  race_tiefling:
    __construct:
      - tiefling
      - <{tiefling_config}>
      - ['@skill_infernal_legacy',
         '@skill_hellish_resistance']

  race_wood_elf:
    __construct:
      - wood elf
      - <{wood_elf_config}>
      - ['@skill_keen_senses',
         '@skill_fey_ancestry',
         '@skill_trance']

  race_high_elf:
    __construct:
      - high elf
      - <{high_elf_config}>
      - ['@skill_keen_senses',
         '@skill_fey_ancestry',
         '@skill_trance',
         '@skill_elf_weapon_training']
