parameters:
  extra_attack_desc:
    '<b>Dodatkowy atak</b> - zyskujesz dodatkowy atak.'
  acid_breath_desc:
    '<b>Zionięcie kwasem</b> - w ramach akcji możesz zionąć kwasem. Obszar
    działania to prosta 1x6 hex, {{ dmg }} obrażeń od kwasu, połowa obrażeń po udanym
    rzucie obronnym na zręczność o ST: {{ dc }}. Zdolność regeneruje się po krótkim
    odpoczynku.'
  acid_resistance_desc:
    '<b>Odporność na kwas</b> - zyskujesz odporność na kwas.'
  action_surge_desc:
    '<b>Przypływ sił</b> - zyskujesz dodatkową akcję, zdolność odnawia się
    po krótkim odpoczynku.'
  ancestral_protectors_desc:
    '<b>Ancestral protectors</b> - starting when you choose this path at 3rd
    level, spectral warriors appear when you enter your rage. While you"re raging,
    the first creature you hit with an attack on your turn becomes the target of
    the warriors, which hinder its attacks. Until the start of your next turn, that
    target has disadvantage on any attack roll that isn"t against you, and when
    the target hits a creature other than you with an attack, that creature has
    resistance to the damage dealt by the attack. The effect on the target ends
    early if your rage ends.'
  assassin_proficiencies_desc:
    '<b>Biegłości skrytobójcy</b> - zyskujesz biegłość w posługiwaniu się zestawem
    do charakteryzacji oraz zestawem truciciela.'
  assassinate_desc:
    '<b>Skrytobójstwo (PHB 81)</b> - zyskujesz następującą przewagę: <ul><li>automatyczne
    trafienia krytyczne w zaskoczone (PHB 189) istoty</li><li>ułatwienie w
    testach ataku przeciwko istotom, które jeszcze nie wykonały swojej tury w całej
    walce.</li></ul>'
  aura_of_protection_desc:
    '<b>Aura ochrony</b> - ty i twoi sojusznicy w obrębie 2 hex od ciebie,
    możecie dodać: +{{ bonus }}, jako premie do rzutu obronnego. Aby aura działała
    musisz być przytomny.'
  aura_of_warding_desc:
    '<b>Aura antymagiczna</b> - ty i twoi sojusznicy w obrębie 2 hex od ciebie
    zyskujecie odporność na obrażenia od czarów.'
  bear_spirit_totem_desc:
    '<b>Bear spirit totem</b> - Bear. While raging, you have resistance to
    all damage except psychic damage. The spirit of the bear makes you tough enough
    to stand up to any punishment.'
  belquath_song_desc:
    "<b>Pieśn Bel'Quatha</b> - raz dziennie możesz zaśpiewać pieśn o tym,
    jak twoja postać pokonała Bel'Quatha, zyskujesz dzięki temu dodatkowy atak."
  bend_luck_desc:
    '<b>Naginanie szczęścia</b> - kiedy istota, którą widzisz, wykonuje test
    ataku, cechy lub rzut obronny, możesz w ramach swojej reakcji wydać 2 pkt zaklinania,
    aby rzucić 1k4 i zastosować wynik jako premię lub karę do rzutu tej istoty.
    Możesz to zrobić po jej rzucie, ale zanim poznasz jego efekt.'
  bite_desc:
    '<b>Ugryzienie</b> - możesz użyć swoich ostrych zębów, aby wykonać akcję
    ataku i ugryźć przeciwnika, modyfikator do trafienia wynosi +{{ attack_mod }},
    jeśli trafisz zadajesz 1k6{{ bonus_dmg }} obrażeń ciętych.'
  bonus_language_desc:
    '<b>Dodatkowy język</b> - potrafisz mówić, czytać i pisać w dodatkowym
    języku.'
  bonus_proficiency_desc:
    '<b>Bonus proficiency</b> - when you choose this archetype at 3rd level,
    you gain proficiency in one of the following skills of your choice: Animal Handling,
    History, Insight, Performance, or Persuasion. Alternatively, you learn one language
    of your choice.'
  born_to_the_saddle_desc:
    '<b>Urodzony w siodle</b> - masz ułatwienie do rzutów obronnych wykonywanych
    w celu uniknięcia upadku z wierzchowca. Jeśli upadasz z wierzchowca z max 3
    metrów to możesz wylądować na nogach, o ile nie jesteś obezwładniony. Wsiadanie
    i zsiadanie z wierzchowca kosztuje cię 1.5 m twojej szybkości.'
  brave_desc:
    '<b>Odwaga (PHB 31)</b> - masz ułatwienie w rzutach obronnych przeciw przerażeniu.'
  brutal_critical_desc:
    '<b>Brutalne obrażenia</b> - podczas trafienia krytycznego możesz rzucić
    dodatkową kością obrażeń.'
  cantrip_desc:
    '<b>Dodatkowa sztuczka</b> - znasz dodatkową sztuczkę.'
  circle_forms_desc:
    '<b>Zwierzęce formy kręgu</b> - ignorujesz kolumnę maks. SW w tabeli formy
    zwierzęce, zamiast tego możesz zamienić się w zwierze o SW: {{ CR }}.'
  combat_wild_shape_desc:
    '<b>Bojowa dzika postać</b> - przemiana w dziką postać kosztuję akcję
    dodatkową, ponadto przebywając w dzikiej postaci możesz w ramach akcji dodatkowej
    poświęcić komórkę czaru, aby odzyskać 1k8 PW za krąg poświęconej komórki.'
  cook_meals_desc:
    'cook meals'
  cook_tools_desc:
    'cook tools'
  cunning_action_desc:
    '<b>Chytre zagranie (PHB 79)</b> - w ramach akcji dodatkowej możesz wykonać
    odstąpienie, sprint lub ukrycie się.'
  danger_sense_desc:
    '<b>Wyczucie zagrożenia</b> - masz ułatwienie w rzutach obronnych na zrc
    przeciw zagrożeniom, które jesteś w stanie zaobserwować, takim jak pułapki i
    zaklęcia. Aby zmysł działał, nie możesz być oślepiony, ogłuchły ani obezwładniony.'
  distracting_strike_desc:
    'distracting strike'
  divine_health_desc:
    '<b>Cudowne zdrowie</b> - zyskujesz odporność na choroby.'
  divine_sense_desc:
    '<b>Cudowny zmysł</b> - w ramach akcji możesz wykryć dobro lub zło. Do
    końca następnej tury w promieniu 12 hex, znasz położenie każdej boskiej, diabelskiej
    lub nieumarłej istoty oraz znasz położenie miejsca lub obiektu, które zostało
    zbezczeszczone lub poświęcone, jeśli nie zasłania jej całkowita przeszkoda.
    Użycia odnawiają się po długim odpoczynku.'
  divine_smite_desc:
    '<b>Boskie ugodzenie</b> - gdy trafiasz cel atakiem wręcz bronią, możesz
    wydać jedną komórkę czarów, aby zadać dodatkowe obrażenia od światłości. Wynoszą
    one 2k8 za komórkę I kręgu, plus 1k8 za każdy krąg powyżej I, aż do maksimum
    6k8. Jeśli cel jest nieumarłym lub czartem, obrażenia zwiększają się o 1k8.'
  druidic_desc:
    'druidic'
  dueling_desc:
    '<b>Fechtunek</b> - gdy dzierżysz broń białą w jednej dłoni otrzymujesz
    +2 do obrażeń zadawanych tą bronią.'
  dwarven_armor_training_desc:
    '<b>Krasnoludzki trening zbrojny</b> - zyskujesz biegłość w lekkich i
    średnich pancerzach.'
  dwarven_combat_training_desc:
    '<b>Krasnoludzki trening bojowy</b> - zyskujesz biegłość w używaniu lekkiego
    młota, młota bojowego, topora bojowego i toporka.'
  dwarven_resilience_desc:
    '<b>Krasnoludzka odporność</b> - zyskujesz ułatwienie w rzutach obronnych
    przeciw truciznom i odporność na obrażenia od trucizn.'
  elf_weapon_training_desc:
    '<b>Elfia szkoła walki</b> - masz biegłość w używaniu krótkiego i długiego
    łuku oraz miecza długiego i krótkiego.'
  evasion_desc:
    '<b>Odskok (PHB 79)</b> - po udanym rzucie obronnym na zręczność nie otrzymujesz
    żadnych obrażeń, a po nieudanym połowę.'
  exhaustion_desc:
    '<table><tr><td colspan="3" style="text-align:center"><b>Wyczerpanie</b></td></tr>
    <tr><td style="text-align:center">poziom</td><td style="text-align:center">efekt</td>
    <td style="text-align:center">status</td></tr><tr><td>1</td><td>utrudnienie w testach cech</td>
    <td></td></tr><tr><td>2</td><td>szybkość zmniejszona o połowę</td><td></td></tr>
    <tr><td>3</td><td>utrudnienie w testach ataku i rzutach obronnych</td><td></td></tr>
    <tr><td>4</td><td>maksymalne PW zmniejszone o połowę</td><td></td></tr><tr><td>5</td>
    <td>szybkość zmniejszona do 0</td><td></td></tr><tr><td>6</td><td>śmierć</td><td></td>
    </tr></table>'
  expertise_I_desc:
    '<b>Znawstwo I (PHB 79)</b> - możesz wybrać dwie umiejętności, w których jesteś biegły,
     premia z biegłości dla tych umiejętności jest podwojona.'
  expertise_II_desc:
    '<b>Znawstwo II (PHB 79)</b> - możesz wybrać dwie umiejętności, w których jesteś biegły,
     premia z biegłości dla tych umiejętności jest podwojona.'
  fast_movement_desc:
    '<b>Szybki ruch</b> - gdy nie nosisz ciężkiego pancerza, twoja szybkość
    jest zwiększona o 2 hex.'
  favored_enemy_desc:
    '<b>Favored enemy</b> - you have advantage on wisdom (survival) checks
    to track your favored enemies, as well as on intelligence checks to recall information
    about them. My favs are: undead, monstrosities.'
  feat_alert_desc:
    '<b>Czujny</b> - zawsze wypatrujesz zagrożenia, dzięki czemu zyskujesz
    poniższe korzyści: <ul><li> otrzymujesz premię +5 do inicjatywy, </li><li> póki
    jesteś przytomny, nie można cię zaskoczyć, </li><li> twoi przeciwnicy
    nie otrzymują ułatwienia w testach ataku, gdy ich nie widzisz. </li></ul>'
  feat_defensive_duelist_desc:
    '<b>Mistrz zasłony</b> - kiedy trzymasz jednoręczną broń finezyjną, w
    której używaniu masz biegłość, a twój przeciwnik <b>trafi cię atakiem wręcz</b>,
    możesz w ramach reakcji dodać +{{ bonus_ac }} do swojej KP.'
  feat_great_weapon_master_desc:
    '<b>Mistrz broni dwuręcznej</b> - gdy korzystasz z broni dwuręcznej: <ul><li>gdy
    w swojej turze uzyskasz trafienie krytyczne lub sprowadzisz przeciwnika do 0
    PW to w ramach akcji dodatkowej możesz wykonać atak wręcz bronią białą,</li><li>przed
    wykonaniem ataku ciężką bronią, w której masz biegłość możesz zdecydować się
    przyjąć karę -5 do testu ataku, jeśli trafisz otrzymasz premię +10 do obrażeń.</li>
    </ul>'
  feat_heavy_armor_master_desc:
    '<b>Mistrz ciężkiego pancerza</b> - wszystkie cięte, kłute lub obuchowe
    obrażenia zadane niemagiczną bronią zostają obniżone o 3, podnieś siłę +1.'
  feat_lucky_desc:
    '<b>Szczęściarz</b> - ilekroć wykonujesz test ataku, test cechy lub rzut
    obronny możesz wydać jeden rzut szczęścia by rzucić dodatkową K20, musisz się
    na to zdecydować przed pierwszym rzutem. Możesz takżę wydać punkt szczęścia
    aby bronić się przed wymierzonym w Ciebie atakiem, rzuć K20 a następnie wybierz
    czy atakujący korzysta z Twojego rzutu, czy ze swojego. Punkty szczęścia odzyskujesz
    po długim odpoczynku.'
  feat_sentinel_desc:
    '<b>Wartownik</b> - zyskujesz następujące korzyści: <ul><li>kiedy
    trafiasz atakiem okazyjnym to szybkość trafionej istoty spada do 0 na resztę
    tury,</li><li>przeciwnicy, którzy wychodzą z twojej strefy ataku, prowokują
    ataki okazyjne nawet jak wykonują akcję odstąpienia,</li><li>kiedy przeciwnik
    w promieniu 1,5 m od ciebie wykonuje atak w inny cel niż ty, to możesz wykorzystać
    reakcję, aby wykonać atak wręcz przeciwko atakującemu.</li></ul>'
  feat_sharpshooter_desc:
    '<b>Strzelec wyborowy</b> - mistrzowsko posługujesz się bronią strzelecką
    i potrafisz oddawać strzały, które inni uważają za niemożliwe. Zyskujesz poniższe
    korzyści: <ul><li> nie otrzymujesz utrudnienia w testach ataku
    za strzelanie do celów na dalekim dystansie,</li><li>twoje ataki bronią dystansową
    ignorują korzyści z osłony połowicznej lub w trzech czwartych,</li><li>zanim
    wykonasz atak bronią dystansową, w której masz biegłość, możesz zdecydować się
    przyjąć karę -5 do trafienia. Jeśli trafisz, otrzymujesz premię +10
    do obrażeń.</li></ul>'
  feat_expert_desc:
    '<b>Expert (TCOE | Feat)</b> - podnieś jedną statystykę o 1, wybierz jedną
    umiejętność - otrzymujesz w niej biegłość oraz ekspertyzę.'
  feat_spell_sniper_desc:
    '<b>Mistyczny strzelec</b> - twoje ataki dystansowe czarami ignorują
    korzyści z osłony połowicznej lub w trzech czwartych oraz jeśli czar wymaga
    wykonania testu ataku, to jego zasięg jest dwukrotnie większy. Dodatkowo dzięki
    tej specjalizacji poznajesz sztuczkę nieziemskie uderzenie.'
  feat_war_caster_desc:
    '<b>Mag bitewny</b> - zyskujesz: <ul><li>kiedy otrzymujesz obrażenia,
    masz ułatwienie w rzutach obronnych na kondycję koniecznych do utrzymania koncentracji
    na zaklęciu,</li><li>jesteś w stanie zapewnić komponent somatyczny do czaru,
    nawet jeśli trzymasz broń lub tarczę w jednej lub obu rękach.</li></ul>'
  feinting_attack_desc:
    '<b>Finta</b> - możesz wydać jedną kość przewagi w ramach akcji dodatkowej
    w swojej turze, by wykonać fintę, markując atak na wybranego przeciwnika znajdującego
    się w obrębie 1,5 m od ciebie. Masz ułatwienie w następnym teście ataku przeciw
    owej istocie w tej turze. Przy trafieniu dodajesz kość przewagi do rzutu na
    obrażenia.'
  feral_instinct_desc:
    '<b>Zwierzęcy instynkt</b> - zyskujesz ułatwienie w testach inicjatywy.
    Co więcej, jeśli jesteś zaskoczony, ale nie obezwładniony to możesz normalnie
    działać w swojej turze, o ile zaczniesz od wpadnięcia w szał.'
  fey_ancestry_desc:
    '<b>Rodowód Fey</b> - masz ułatwienie w rzutach obronnych przeciw zauroczeniu
    i magia nie może cię uśpić.'
  fighting_style_protection_desc:
    '<b>Defensywny styl walki</b> - gdy nosisz pancerz, zyskujesz +1 do KP.'
  font_of_magic_desc:
    '<b>Punkty zaklinania</b> - posiadasz 10 punktów zaklinania,
    odzyskujesz je po długim odpoczynku. <p><b>Elastyczne czarowanie</b> - możesz wykorzystywać
    punkty zaklinania do odzyskiwania komórek czarów i odwrotnie, możesz poświęcać
    komórki czarów, by otrzymać w ten sposób punkty zaklinania. </p><p><b>Tworzenie
    komórek czarów</b> - w ramach akcji dodatkowej w swojej turze możesz przekształcić
    niewydane jeszcze punkty zaklinania w komórkę czaru. Koszt utworzenia komórki
    danego kręgu zawiera tabela Tworzenie komórek czarów. Możesz stworzyć komórkę
    maksymalnie 5. kręgu. Wszystkie stworzone w ten sposób komórki znikają, kiedy
    kończysz długi odpoczynek.</p><table><tr><td colspan="2">Tworzenie
    komórek czarów</td></tr><tr><td>krąg czaru</td><td>koszt
    w punktach zaklinania</td></tr><tr><td>1</td><td>2</td></tr><tr><td>2</td><td>3</td></tr><tr><td>3</td><td>5</td></tr><tr><td>4</td><td>6</td></tr><tr><td>5</td><td>7</td></tr></table>
    <p><b>Przekształcenie komórek czarów w punkty zaklinania</b> - w ramach akcji
    dodatkowej w swojej turze możesz poświęcić jedną komórkę czaru, by otrzymać
    liczbę punktów zaklinania równą kręgowi tej komórki.</p>'
  frenzy_desc:
    '<b>Furia</b> - możesz na początku szału wpaść w furię. Kiedy to zrobisz,
    w każdej swojej następnej turze w trakcie trwania szału możesz w ramach akcji
    dodatkowej wykonać atak wręcz. Po zakończeniu szału otrzymujesz 1 poziom wyczerpania.'
  grappling_desc:
    '<b>Pochwycenie (PHB 195)</b> - <ul><li>w ramach akcji ataku, albo
    jako jeden z ataków jeśli posiadasz ich parę - możesz pochwycić istotę.
    Cel twojego pochwycenia musi być co najwyżej jeden rozmiar większy od ciebie,
    znajdować się w twojej strefie ataku, oraz musisz mieć wolną co najmniej
    jedną rękę</li><li>zamiast testu ataku wykonujesz test pochwycenia, jest
    to twoja wartość atletyki przeciwko wartości atletyki lub akrobatyki
    celu, wygrywasz automatycznie, jeśli cel jest obezwładniony</li><li>jeśli
    wygrasz, twój cel staje się pochwycony, możesz uwolnić cel w dowolnym momencie
    i nie wymaga to żadnej akcji.</li></ul><b>Stan pochwycony (PHB 291)</b> -
    <ul><li>szybkość istoty spada do 0 i nie może korzystać z premii do szybkości</li><li>stan
    pochwycenia kończy się, jeśli jakiś efekt usunie pochwycone stworzenie z zasięgu
    chwytającego, np. wybuch</li></ul><b>Uwolnienie się z pochwycenia (PHB 195)</b>
    - pochwycona istota może użyć swojej akcji, aby spróbować się uwolnić, w tym
    celu musi wykonać test swojej atletyki lub akrobatyki przeciwko atletyce chwytającego.<br>
    <b>Przemieszczanie pochwyconej istoty (PHB 195)</b> - jeśli pochwycona istota
    nie jest conajmniej dwa rozmiary mniejsza o ciebie, to możesz ją przemieszczać
    z połową swojej szybkości.'
  hellish_resistance_desc:
    '<b>Piekielna odporność</b> - masz odporność na obrażenia od ognia.'
  hold_breath_desc:
    '<b>Nurek</b> - możesz wstrzymać swój oddech na 15 min.'
  hungry_jaws_desc:
    '<b>Głodne szczęki</b> - w ramach akcji dodatkowej możesz użyć swojej
    zdolności ugryzienia, <b>jeżeli trafisz</b> to zyskujesz tymczasowe PW w wysokości
    {{ bonus_hp }} i tracisz jedno użycie. Zdolność odnawia się po długim odpoczynku.'
  infernal_legacy_desc:
    '<b>Diabelska spuścizna</b> - dzięki swojemu diabelskiemu pochodzeniu
    znasz sztuczkę taumaturgia, a raz na długi odpoczynek możesz rzucić gratis ciemność
    oraz piekielną reprymende.'
  juan_notes_desc:
    '<b>Notatki</b> - <table><tr><td></td><td>STR</td><td>DEX</td><td>CON</td></tr><tr><td>Feat
    expertize (human variant)</td><td>+1</td><td></td><td></td></tr><tr><td>ASI
    human variant</td><td>+1</td><td></td><td>+1</td></tr><tr><td>ASI
    4 LVL</td><td>+2</td><td></td><td></td></tr><tr><td>ASI
    6 LVL</td><td></td><td></td><td>+2</td></tr><tr><td>ASI
    8 LVL</td><td>+1</td><td>+1</td><td></td></tr>
    </table><b>Znane sztuczki</b> - kuglarstwo, tańczące światła.<br><b>Znane
    czary</b> - absorb elements, protection from evil and good, magic weapon, enlarge/reduce,
    shield, silvery barbs<br><b>Komórki czarów</b> - 4 kręgu pierwszego, 2 kręgu
    drugiego.'
  keen_senses_desc:
    '<b>Wyostrzone zmysły</b> - masz biegłość w percepcji.'
  lay_on_hands_desc:
    '<b>Nakładanie rąk</b> - w ramach akcji możesz wyleczyć PW w ilości: {{
    pointsCount }}. Zdolność regeneruje się po długim odpoczynku. Możesz dzielić
    zużyte punkty. Opcjonalnie możesz wydać 5 punktów z puli, aby uleczyć kogoś
    z jednej choroby lub zneutralizować jedną truciznę.'
  lucky_desc:
    '<b>Szczęście (PHB 31)</b> - kiedy wyrzucisz 1 w teście ataku/cechy/rzucie
    obronnym, możesz przerzucić kość i musisz zaakceptować nowy wynik.'
  maneuver_save_dc_desc:
    '<b>ST przeciw manewrom</b> - wynosi {{ dc }}.'
  metamagic_desc:
    '<b>Metamagia</b> - otrzymujesz trzy metamagiczne możliwości, gdy rzucasz
    czar możesz użyć tylko jednej opcji metamagii, chyba że określono inaczej. <p><b>Wzmocnione
    zaklęcie</b> - za 1 pkt zaklinania przerzucasz 1 kość obrażeń, nie możesz przerzucić
    więcej kości niż twój mod z charyzmy, musisz przyjąć nowy wynik. Możesz skorzystać
    ze wzmocnionego zaklęcia, nawet jeśli już skorzystałeś z innej opcji metamagii.</p>
    <p><b>Przedłużone zaklęcie</b> - za 1 pkt zaklinania podwajasz czas działania
    czaru, maksymalnie do 24 godzin.</p><p><b>Przyspieszone zaklęcie</b> - za 2 pkt
     zaklinania możesz skrócić czas rzucania czaru z akcji głównej do akcji dodatkowej.</p>'
  mindless_rage_desc:
    '<b>Bezmyślny szał</b> - podczas szału nie możesz zostać zauroczony ani
    przerażony. Jeśli jesteś zauroczony lub przerażony w momencie wpadania w szał,
    ten efekt zostaje zawieszony do czasu zakończenia szału.'
  mystic_wisdom_desc:
    '<b>Mistyczna wiedza</b> - w borze w Starej Dombrowie, udało ci się zdobyć
    unikalną wiedzę, która pozwala ci rzucić jeszcze jedno zaklęcie II kręgu raz
    na długi odpoczynek.'
  natural_armor_desc:
    '<b>Naturalny pancerz</b> - masz grubą skórę pokrytą twardymi łuskami,
    gdy nie nosisz pancerza twoja KP wynosi {{ ac }}.'
  natural_explorer_desc:
    '<b>Natural explorer</b> - when you make an intelligence or wisdom check
    related to your favored terrain, your proficiency bonus is doubled if you are
    using a skill that you"re proficient in. While traveling for an hour or more
    in your favored terrain, you gain the following benefits: <ul><li>difficult
    terrain doesn"t slow your group"s travel,</li><li>your group can"t become
    lost except by magical means,</li><li>even when you are engaged in another
    activity while traveling (such as foraging, navigating, or tracking), you remain
    alert to danger,</li><li>if you are traveling alone, you can move stealthily
    at a normal pace,</li><li>when you forage, you find twice as much food
    as you normally would,</li><li>while tracking other creatures, you also
    learn their exact number, their sizes, and how long ago they passed through
    the area.</li></ul> My favs are: mountains, forests.'
  naturally_stealthy_desc:
    '<b>Niezauważalny (PHB 31)</b> - możesz próbować się ukryć, gdy zasłania
    cię istota, która jest większego rozmiaru niż ty.'
  nature_intuition_desc:
    '<b>Nature intuition</b> - Thanks to your mystical connection to nature,
    you gain proficiency with two of the following skills of your choice: Animal
    Handling, Medicine, Nature, Perception, Stealth, or Survival..'
  nimble_desc:
    '<b>Niziołcza zwinność (PHB 31)</b> - możesz przemieścić się przez pole
    zajmowane przez inną istotę, która jest większego rozmiaru niż ty.'
  oath_of_the_ancients_paladin_channel_divinity_desc:
    '<b>Akty wiary</b> - możesz wykonać jeden akt wiary, użycie odnawia się
    po krótkim lub długim odpoczynku. <ul><li><b>Gniew Natury</b>
    - powodujesz wzrost widmowych pnączy sięgających po istotę, którą widzisz w
    obrębie 2 hex od ciebie. Cel musi wykonać rzut obronny na siłę lub zręczność
    albo zostanie unieruchomiony, cel może powtórzyć rzut obronny na koniec
    każdej swojej tury. Jeśli uda mu się uwolnić, to pnącza znikają. </li><li><b>Odpędzanie
    Niewiernych</b> - każdy słyszący cię czart lub fey w obrębie 6 hex od ciebie,
    musi wykonać rzut obronny na mądrość, inaczej zostanie odpędzony na
    1 minutę albo do czasu otrzymania obrażeń. Odpędzona istota próbuje oddalić
    się od ciebie i nie może z własnej woli zbliżyć się do ciebie bliżej
    niż na 6 hex. Nie może podejmować reakcji, może używać akcji uników
    lub sprintu. Jeśli prawdziwą postać istoty skrywa iluzja, zmiennokształtność
    albo inny efekt, to natura istoty zostaje ujawniona. </li></ul>'
  oath_of_the_ancients_paladin_spells_desc:
    '<b>Zaklęcia przysięgi</b> - znasz następujące zaklęcia: <span style="color:
      gray;">{{ oathSpells|join(", ') }}</span>. Te zaklęcia są zawsze przygotowane
    i nie wliczają się do limitu przygotowanych czarów.'
  oath_of_the_devotion_paladin_channel_divinity_desc:
    '<b>Akty wiary</b> - możesz wykonać jeden akt wiary, użycie odnawia się
    po krótkim lub długim odpoczynku.'
  oath_of_the_devotion_paladin_spells_desc:
    '<b>Zaklęcia przysięgi</b> - znasz następujące zaklęcia: <span style="color:
      gray;">{{ oathSpells|join(", ') }}</span>. Te zaklęcia są zawsze przygotowane
    i nie wliczają się do limitu przygotowanych czarów.'
  parry_desc:
    '<b>Parowanie</b> - gdy napastnik zadaje ci obrażenia atakiem wręcz, możesz
    w ramach reakcji użyć kości przewagi, by zredukować obrażenia o wynik z kości
    przewagi + {{ dex_mod}} (modyfikator ze zręczności).'
  precision_attack_desc:
    'precission attack'
  primal_strike_desc:
    '<b>Pierwotne uderzenie</b> - ataki twojej zwierzęcej formy są traktowane
    jak magiczne przy rozliczaniu odporności i niepodatności na niemagiczne ataki
    i obrażenia.'
  rage_desc:
    '<b>Szał</b> - zużyj akcję dodatkową aby wejść w szał, który trwa 1 minutę,
    zyskujesz: <ul><li>+{{ damage }} obrażeń do broni opartych na sile,</li><li>{{
    resistances }},</li><li>rzuty obronne na siłę i testy siły wykonujesz z
    ułatwieniem.</li></ul><p>Szał kończy się, jeśli stracisz przytomność albo
    jeśli twoja tura skończy się, a ty nie zaatakowałeś wrogiej istoty lub nie
    otrzymałeś obrażeń. Możesz także zakończyć szał akcją dodatkową. Podczas szału 
    nie możesz rzucać czarów. Zdolność odnawia się po długim odpoczynku.</p>'
  reckless_attack_desc:
    '<b>Szaleńczy atak</b> - przy pierwszym ataku w swojej turze możesz zdecydować
    się na szaleńczy atak. Daje ci on do końca tej tury ułatwienie w testach ataku
    wręcz bronią opartą na sile, lecz do twojej następnej tury ataki przeciw tobie
    również są wykonywane z ułatwieniem.'
  riposte_desc:
    '<b>Riposta</b> - gdy przeciwnik nie trafi cię atakiem wręcz, możesz w
    ramach reakcji wydać kość przewagi, by wykonać przeciw niemu atak wręcz. Przy
    trafieniu dodajesz kość przewagi do rzutu na obrażenia.'
  second_wind_desc:
    '<b>Drugi oddech</b> - w ramach akcji dodatkowej możesz odzyskać PW w
    liczbie równej 1k10+{{ bonus_hp }}, zdolność odnawia się po krótkim odpoczynku.'
  shove_desc:
    '<b>Odepchnięcie / powalenie (PHB 195)</b> - <ul><li>w ramach akcji
    ataku, albo jako jeden z ataków jeśli posiadasz ich parę - możesz odepchnąć
    lub powalić istotę. Cel twojego pochwycenia musi być co najwyżej jeden
    rozmiar większy od ciebie, znajdować się w twojej strefie ataku</li><li>zamiast
    testu ataku wykonujesz test atletyki przeciwko wartości atletyki lub akrobatyki
    celu, wygrywasz automatycznie, jeśli cel jest obezwładniony</li><li>jeśli
    wygrasz, twój cel staje się powalony lub odepchnięty na 1 hex od ciebie.</li>
    </ul><b>Stan powalony (PHB 291)</b> - <ul><li>powalone stworzenie może
    się czołgać, chyba że się podniesie (kosztuje to połowę ruchu) i tym samym zakończy
    ten stan</li><li>powalone stworzenie ma utrudnienie w testach ataku</li><li>test
    ataku przeciwko powalonemu stworzeniu wykonywany jest z ułatwieniem, o ile atakujący
    znajduje się 1 hex od celu, w innym wypadku atak wykonywany jest z utrudnieniem.</li>
    </ul>'
  sneak_attack_desc:
    '<b>Ukradkowy Atak</b> - <i style="color: gray;">raz na turę</i> możesz
    zadać {{ sneakAttackDiceCount }}k6 dodatkowych obrażeń:
    <ul><li>gdy koło celu znajduje się przytomny sojusznik lub masz ułatwienie
    w ataku,</li><li>gdy używasz broni finezyjnej lub dystansowej,</li><li>w
    wypadku ataku krytycznego rzucasz kośćmi ukradkowego ataku dwukrotnie (PHB 196),</li><li>jeśli
    przy ataku okazyjnym, spełniasz warunki ukradkowego ataku, to możesz go użyć zgodnie
    z zasadą "raz na turę",</li><li>w przypadku ataku z zaskoczenia przy ataku
    bronią dystansową i strzelając w cel w długim zasięgu broni, możesz użyć tej zdolności,
    ponieważ posiadasz disadvantage do trafienia, ale nie do zaskoczenia,</li><li>gdy
    używasz dwóch broni naraz, jeśli nie użyjesz ukradkowego ataku podczas pierwszego
    ataku, bo np. nie trafisz, to możesz go użyć przy ataku drugą ręką.</li></ul>'
  sathoris_spellcasting_desc:
    '<b>Rzucanie czarów</b> - zużyte komórki czarów odnawiają się po długim
    odpoczynku. 
    <table>
        <tr>
          <td></td>
          <td>I</td>
          <td>II</td>
          <td>III</td>
          <td>IV</td>
          <td>V</td>
        </tr>
        <tr>
          <td><strong>max</strong></td>
          <td>4</td>
          <td>3</td>
          <td>3</td>
          <td>3</td>
          <td>2</td>
        </tr>
        <tr>
          <td><strong>użyte</strong></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
    </table>'
  spirit_seeker_desc:
    '<b>Duchowy wędrowiec</b> - twoja ścieżka wiedzie cię ku harmonii z przyrodą,
    zyskujesz możliwość rzucania czarów zwierzęce zmysły oraz rozmawianie ze zwierzętami,
    ale wyłącznie jako rytuały.'
  spirit_shield_desc:
    '<b>Spirit shield</b> - beginning at 6th level, the guardian spirits that
    aid you can provide supernatural protection to those you defend. If you are
    raging and another creature you can see within 30 feet of you takes damage,
    you can use your reaction to reduce that damage by 2d6. When you reach certain
    levels in this class, you can reduce the damage by more: by 3d6 at 10th level
    and by 4d6 at 14th level.'
  stone_cunning_desc:
    '<b>Wiedza o kamieniu</b> - dodajesz podwójną premię z biegłości w teście
    inteligencji (historia) dla rzeczy stworzonych z kamienia.'
  superiority_dice_desc:
    '<b>Kości przewagi</b> - są to cztery kości k8.'
  thieves_cant_desc:
    '<b>Grypsera (PHB 79)</b> - możesz komunikować się za pomocą grypsery, potrafisz
    rozpoznać symbole używane do przekazania informacji takich jak: czy
    obszar jest niebezpieczny, czy terytorium należy do gildii złodziei, czy w pobliżu
    znajduje się potencjalny łup, czy w okolicy znajdują się łatwe ofiary lub sojusznicy,
    którzy mogą cię ukryć.'
  tides_of_chaos_desc:
    '<b>Pływy chaosu</b> - raz na długi odpoczynek możesz zyskać ułatwienie
    w jednym teście ataku lub cechy albo w rzucie obronnym.'
  trance_desc:
    '<b>Trans</b> - zamiast snu, wchodzisz w 4 godzinny trans, który jest
    odpowiednikiem 8 godzin snu.'
  trip_attack_desc:
    'trip attack'
  unarmed_fighting_style_desc:
    '<b>Walka bez broni</b> - (TCoE | styl walki) twoje ataki wręcz bez broni
    zadają 1k6+{{ strMod }} lub, jeśli masz wolne obie ręce 1k8+{{ strMod }} obrażeń
    obuchowych. Na początku każdej swojej tury możesz zadać 1k4 obrażeń obuchowych
    istocie, która jest przez ciebie pochwycona.'
  unarmored_defense_desc:
    '<b>Obrona bez pancerza</b> - jeśli nie nosisz zbroi, to twoja KP wynosi
    10 + mod ze zręczności + mod z kondycji. Możesz do KP doliczyć wartość z tarczy.'
  uncanny_dodge_desc:
    '<b>Niesamowity unik (PHB 79)</b> - gdy trafi cię przeciwnik, którego
    widzisz, w ramach reakcji możesz zmniejszyć o połowę otrzymane obrażenia.'
  unwavering_mark_desc:
    '<b>Niezachwiany cel</b> - gdy trafiasz stworzenie atakiem wręcz bronią,
    możesz oznaczyć je do końca swojej następnej tury. Efekt kończy się wcześniej,
    jeśli zostaniesz obezwładniony lub umrzesz. Kiedy oznaczone przez ciebie stworzenie
    znajduje się w obrębie 1 hex od ciebie, ma utrudnienie w każdym teście ataku,
    który nie jest wymierzony w ciebie. Ponadto, jeżeli oznaczone przez ciebie stworzenie
    <b>zada obrażenia</b> komuś innemu niż ty, to w swojej następnej turze, w ramach
    akcji dodatkowej możesz wykonać przeciw niemu specjalny atak wręcz bronią -
    masz ułatwienie w tym teście ataku, a twoja broń zada celowi dodatkowe obrażenia
    równe {{ bonus_damage }}. Oznaczanie wrogów jest nie ograniczone, ale ilość
    specjalnych ataków wynosi {{ count }}. Odzyskujesz wszystkie wykorzystane użycia
    po długim odpoczynku.'
  war_magic_desc:
    '<b>Magia bojowa</b> - gdy wykorzystasz akcje na rzucenie sztuczki, możesz
    w ramach akcji dodatkowej wykonać pojedyńczy atak bronią.'
  wild_magic_surge_desc:
    '<b>Przypływ dzikiej magii</b> - raz na turę, kiedy rzucasz czar zaklinacza,
    MP może ci kazać rzucić na efekt w tabeli Przypływu Dzikiej Magii. Metamagia
    nie działa na czary z przypływu.'
  wild_shape_desc:
    '<b>Dzika postać</b> - możesz przemienić się w następujące formy zwierzęce:
    <table><tr><td colspan="4">Formy zwierzęce</td></tr><tr><td>poziom</td><td>maks.
    SW</td><td>ograniczenia</td><td>przykład</td></tr><tr><td>2</td><td>1/4</td><td>nie
    ma szybkości lotu lub pływania</td><td>wilk</td></tr><tr><td>4</td><td>1/2</td><td>nie
    ma szybkości lotu</td><td>krokodyl</td></tr><tr><td>8</td><td>1</td><td>-</td><td>olbrzymi
    orzeł</td></tr></table>'
  canny_desc:
    '<b>Sprytny</b> - wybierz jedną umiejętność, podwój premia z biegłości dla tej umiejętności.
    Poznajesz dwa języki, zaimplementować requirement.'
  archery_fighting_style_desc:
    '<b>Dystansowy styl walki</b> - otrzymujesz premię +2 do trafienia gdy korzystasz z broni dystansowych.'
  intimidating_presence_desc:
    '<b>Złowroga postawa</b> - możesz użyć swojej akcji, aby przestraszyć kogoś swoją groźną postawą. 
    Wybierz jedną istotę znajdującą się do 6 hex od ciebie. Jeżeli cię widzi lub słyszy, musi wykonać rzut obronny
    na mądrość o ST {{ wisDc }}. W przypadku niepowodzenia cel staje się przerażony do końca twojej następnej tury.
    W następnych turach możesz w ramach swojej akcji przedłużać działanie efektu o kolejną turę. Efekt kończy się,
    jeśli przerażona istota zakończy swoją turę poza zasięgiem wzroku lub dalej niż 12 hex od ciebie. Jeśli cel zda
    rzut obronny, nie możesz na nim powtarzać próby zastraszenia przez najbliższe 24 godziny.'