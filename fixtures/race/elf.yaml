parameters:
  elf_config:
    '{
         "asi": [
             {
                 "ability": "dex",
                 "value": 2
             }
         ],
         "languages": ["common", "elvish"],
         "speed_in_meters": 9,
         "darkvision_in_meters": 18
    }'
  high_elf_config:
    '{
         "asi": [
             {
                 "ability": "int",
                 "value": 1
             }
         ]
    }'
  wood_elf_config:
    '{
         "asi": [
             {
                 "ability": "wis",
                 "value": 1
             }
         ]
    }'

App\Entity\Race:
  race_elf:
    __construct:
      - elf
      - <{elf_config}>
      - [
        '@skill_keen_senses',
        '@skill_fey_ancestry',
        '@skill_trance'
      ]
  race_high_elf:
    __construct:
      - high elf
      - <{high_elf_config}>
      - [ '@skill_elf_weapon_training' ]
      - [
        '@requirement_high_elf_race_cantrip',
        '@requirement_high_elf_race_extra_language'
      ]
      - '@race_elf'
  race_wood_elf:
    __construct:
      - wood elf
      - <{wood_elf_config}>
      - [
        '@skill_elf_weapon_training',
        '@skill_fleet_of_foot',
        '@skill_mask_of_the_wild'
      ]
      - [ ]
      - '@race_elf'
