         "required_count": 1,
         "level": 1
    }'
  requirement_origin_single_language_config:
    '{
         "source": "origin",
         "required_count": 1,
         "level": 1
    }'
  requirement_origin_two_languages_config:
    '{
         "source": "origin",
         "required_count": 2,
         "level": 1
    }'

App\Entity\Requirement:
