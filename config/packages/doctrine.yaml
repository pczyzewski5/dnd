doctrine:
    dbal:
        driver: 'pdo_mysql'
        host: '%dnd.mysql_host%'
        port: '%dnd.mysql_port%'
        dbname: '%dnd.mysql_database%'
        user: '%dnd.mysql_user%'
        password: '%dnd.mysql_password%'
        charset: 'UTF8'
        server_version: '8.0'
        options:
          {1002: "SET NAMES utf8mb4;"}

    orm:
        auto_generate_proxy_classes: '%kernel.debug%'
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            User:
                is_bundle: false
                dir: '%kernel.project_dir%/src/User/Entity'
                prefix: 'App\User\Entity'
                alias: User

            PlayerCharacter:
                is_bundle: false
                dir: '%kernel.project_dir%/src/PlayerCharacter/Entity'
                prefix: 'App\PlayerCharacter\Entity'
                alias: PlayerCharacter
