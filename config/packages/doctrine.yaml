doctrine:
    dbal:
        driver: 'pdo_mysql'
        host: '%env(DATABASE_HOST)%'
        port: '%env(DATABASE_PORT)%'
        dbname: '%env(DATABASE_NAME)%'
        user: '%env(DATABASE_USER)%'
        password: '%env(DATABASE_PASSWORD)%'
        charset: 'UTF8'
        server_version: '8.0'
        options:
          {1002: "SET NAMES utf8mb4;"}

    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

            PlayerCharacter:
              type: attribute
              is_bundle: false
              dir: '%kernel.project_dir%/src/PlayerCharacter/Entity'
              prefix: 'App\PlayerCharacter\Entity'
              alias: PlayerCharacter

            Calendar:
              type: attribute
              is_bundle: false
              dir: '%kernel.project_dir%/src/Calendar/Entity'
              prefix: 'App\Calendar\Entity'
              alias: Calendar

#docelowo zmienic na App: i co daje prefix oraz alias
            Modules:
              type: attribute
              is_bundle: false
              dir: '%kernel.project_dir%/src'
              prefix: 'App'
              alias: App
