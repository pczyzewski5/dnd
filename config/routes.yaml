controllers:
  resource: ../src/
  type: attribute

calendar_list:
    path: /calendar/list
    controller: App\Controller\CalendarController::list
    methods: [ GET ]

calendar_create:
    path: /calendar/create
    controller: App\Controller\CalendarController::create
    methods: [ GET, POST ]

calendar_delete:
    path: /calendar/{id}/delete
    controller: App\Controller\CalendarController::delete
    methods: [ GET ]

calendar_answer:
    path: /calendar/{id}/answer
    controller: App\Controller\CalendarController::answer
    methods: [ GET, POST ]
