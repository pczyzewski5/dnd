services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\MonsterManual\Infrastructure\Http\Controller\:
      resource: '../src/MonsterManual/Infrastructure/Http/Controller'
      tags: ['controller.service_arguments']

    App\MonsterManual\Application\:
      resource: '../src/MonsterManual/Application'

    App\Character\Query\:
      resource: '../src/Character/Query'

    App\PlayerCharacter\Repository\:
      resource: '../src/PlayerCharacter/Repository'

    App\PlayerCharacter\Entity\:
      resource: '../src/PlayerCharacter/Entity'

    App\Controller\:
      resource: '../src/Controller'
      public: true

    App\DevService\ProjectDir:
        arguments:
          $projectDir: '%kernel.project_dir%'

    App\Service\:
      resource: '../src/Service'
      public: true

    App\Calendar\:
      resource: '../src/Calendar'
      exclude:
        - '../src/Calendar/Query'
        - '../src/Calendar/Command'
        - '../src/Calendar/Entity'
        - '../src/Calendar/Exception'
        - '../src/Calendar/CalendarService.php'
      public: true

    App\User\:
      resource: '../src/User'
      exclude:
        - '../src/User/Query'
        - '../src/User/Command'
        - '../src/User/Entity'
      public: true

    App\Form\:
      resource: '../src/Form'
      public: true

    App\Calculator\:
        resource: '../src/Calculator'
        public: true

    App\Repository\:
        resource: '../src/Repository'
        public: true

    App\Builder\:
        resource: '../src/Builder'
        public: true

    App\Mapper\:
        resource: '../src/Mapper'
        public: true

    App\Cli\:
        resource: '../src/Cli'
        public: true

    App\Command\WriteFileCommand:
        arguments:
            $itemCardImagesAllowedMime: '%item_card_images_allowed_mime%'
            $itemCardImagesDirectory: '%item_card_images_directory%'

    App\ItemCard\Query\GetItemCardFrontHtmlHandler:
        arguments:
            $itemCardStylesPath: '%item_card_css_path%'

    App\ItemCard\Query\GetItemCardBackHtmlHandler:
        arguments:
            $itemCardStylesPath: '%item_card_css_path%'

    App\ItemCard\Command\UpdateItemCardHandler:
        arguments:
            $itemCardImagesDirectory: '%item_card_images_directory%'

    App\Command\DeleteFileCommand:
        arguments:
            $filesDirectory: '%item_card_images_directory%'

    App\Twig\ProficiencyDot:
        class: App\Twig\ProficiencyDot
        arguments:
            - '@twig'
        tags: [ 'twig.extension' ]

    App\Twig\QuillDeltaParser:
        class: App\Twig\QuillDeltaParser
        arguments:
            - '@twig'
        tags: [ 'twig.extension' ]

    App\Twig\ValueDecorator:
        class: App\Twig\ValueDecorator
        tags: [ 'twig.extension' ]

    App\Twig\UcWords:
        class: App\Twig\UcWords
        tags: [ 'twig.extension' ]

    App\Twig\BackgroundColorCss:
        class: App\Twig\BackgroundColorCss
        arguments:
            - '%character_card_dev_mode%'
        tags: [ 'twig.extension' ]

    App\Twig\GetImageUrl:
        class: App\Twig\GetImageUrl
        arguments:
            - '%item_card_images_directory%'
        tags: [ 'twig.extension' ]

imports:
    - { resource: 'parameters.yaml' }
