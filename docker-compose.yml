services:
  nginx:
    container_name: dnd-nginx
    image: nginx
    depends_on:
      - php
    ports:
      - '8080:80'
    links:
      - php
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - .:/var/www
    networks:
      - dnd_network

  php:
    container_name: dnd-php
    build: ./docker/php
    expose:
      - 9000
      - 9003
    volumes:
      - .:/var/www
      - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    links:
      - mysql
    working_dir: /var/www
    env_file:
      - .env
    networks:
      - dnd_network

  mysql:
    container_name: dnd-mysql
    image: mysql:8.0
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dnd
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dnd_network

volumes:
  mysql_data:

networks:
  dnd_network:
